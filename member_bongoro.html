<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ぼんごろ - 狂乱ファミリー 公式</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #121212; --text-color: #f0f0f0; --theme-color: #ff3333; }
        body { margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-color); font-family: 'Noto Sans JP', sans-serif; overflow-x: hidden; }
        h1, h2, h3 { font-family: 'Dela Gothic One', cursive; letter-spacing: 2px; }
        a { text-decoration: none; }
        
        header { padding: 20px; background: rgba(0,0,0,0.8); border-bottom: 2px solid var(--theme-color); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(5px); display: flex; justify-content: space-between; align-items: center; }
        .back-btn { color: #fff; font-weight: bold; border: 1px solid #555; padding: 8px 15px; border-radius: 5px; transition: background 0.2s; }
        .back-btn:hover { background: #333; }
        .header-title { font-family: 'Dela Gothic One', cursive; color: var(--theme-color); }
        
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        
        .profile-card { background: rgba(30,30,30,0.9); border-radius: 20px; border: 1px solid #333; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.8); display: grid; grid-template-columns: 1fr 1.2fr; gap: 30px; padding: 40px; }
        @media (max-width: 768px) { .profile-card { grid-template-columns: 1fr; padding: 20px; } }
        
        .img-box { background: rgba(255,255,255,0.03); border-radius: 15px; display: flex; align-items: center; justify-content: center; height: 450px; overflow: hidden; border: 1px solid #222; }
        .img-box img { max-height: 100%; max-width: 100%; object-fit: contain; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.8)); }
        
        .info-box { display: flex; flex-direction: column; justify-content: center; }
        .role-tag { display: inline-block; background: rgba(255,51,51,0.1); border: 1px solid var(--theme-color); color: var(--theme-color); padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; align-self: flex-start; margin-bottom: 15px; }
        .member-title { font-size: 3rem; margin: 0 0 15px 0; color: #fff; text-shadow: 0 0 10px rgba(255,51,51,0.3); }
        
        .quote-box { background: #1a1a1a; border-left: 4px solid var(--theme-color); padding: 15px 20px; margin-bottom: 25px; border-radius: 0 10px 10px 0; }
        .quote-box p { margin: 0; font-style: italic; color: #ddd; font-size: 1.05rem; }
        
        .section-label { font-size: 1.1rem; color: #888; border-bottom: 1px solid #333; padding-bottom: 5px; margin-top: 20px; margin-bottom: 10px; }
        .motto-text { font-size: 1.3rem; font-weight: bold; color: #fff; line-height: 1.5; margin: 0 0 20px 0; }
        .about-text { font-size: 0.95rem; line-height: 1.8; color: #ccc; }

        footer { text-align: center; padding: 40px; background: #0a0a0a; color: #555; font-size: 0.9rem; margin-top: 60px; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-btn">← トップページへ戻る</a>
        <div class="header-title" id="profile-header-title">ぼんごろ PROFILE</div>
    </header>

    <div class="container">
        <div class="profile-card">
            <div class="img-box">
                <img id="member-img" src="https://placehold.co/400x600/1a1a1a/ff3333?text=Bongoro" alt="ぼんごろ 立ち絵">
            </div>
            <div class="info-box">
                <span class="role-tag" id="member-role">特攻隊長</span>
                <h1 class="member-title" id="member-name">ぼんごろ (Bongoro)</h1>
                
                <div class="quote-box">
                    <p id="member-quote">「あ、手が滑って大夫の車爆破しちゃったわｗｗ」</p>
                </div>

                <div class="section-label">座右の銘</div>
                <div class="motto-text" id="member-motto">迷ったら撃て、爆破しろ</div>

                <div class="section-label">PROFILE / ABOUT</div>
                <div class="about-text" id="member-about">
                    赤スーツに身を包んだ、狂乱ファミリー最強のトラブルメーカーであり起爆剤。<br>
                    GTA5での味方へのフレンドリーファイアや車両爆破はお約束。予測不能な突撃と確信犯的な爆笑プレイで、常にチームを大パニックに陥れる。<br>
                    カオスな展開を自ら作り出す天性のエンターテイナー。
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 狂乱ファミリー All Rights Reserved.</p>
    </footer>

    <script>
        const MEMBER_ID = 'bongoro';
        const MICROCMS_API_KEY = 'z72ZTLbVPzP6AoXqrOp1aUVZDmcTDhBerXcH';
        const MICROCMS_MEMBERS_URL = 'https://kyouran-web.microcms.io/api/v1/members';

        window.onload = function() {
            if (MICROCMS_MEMBERS_URL) {
                const fetchOptions = { headers: { 'X-MICROCMS-API-KEY': MICROCMS_API_KEY } };
                fetch(MICROCMS_MEMBERS_URL, fetchOptions)
                    .then(r => r.json())
                    .then(d => {
                        const member = d.contents.find(m => m.member_id === MEMBER_ID);
                        if (member) {
                            if (member.name) {
                                document.getElementById('member-name').innerText = member.name;
                                document.getElementById('profile-header-title').innerText = `${member.name} PROFILE`;
                            }
                            if (member.role) document.getElementById('member-role').innerText = member.role;
                            if (member.image) document.getElementById('member-img').src = member.image.url;
                            if (member.quote) document.getElementById('member-quote').innerText = `「${member.quote}」`;
                            if (member.motto) document.getElementById('member-motto').innerText = member.motto;
                            if (member.about) document.getElementById('member-about').innerHTML = member.about.replace(/\n/g, '<br>');
                        }
                    }).catch(e => console.error('メンバー詳細取得エラー:', e));
            }
        };
    </script>
</body>
</html>
